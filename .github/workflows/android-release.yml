name: Android-Release

# Ein Tag wie v0.1.0 baut die signierte APK und legt ein GitHub-Release mit ihr an.
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 der Datei ~/.android/traffic-maniac-release.jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Fehlen sie, wird mit dem Debug-Schlüssel signiert (installierbar, aber spätere Versionen nicht als Update).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Release-Schlüssel hinterlegt – die APK wird mit dem Debug-Schlüssel signiert."
          fi
      - name: APK bauen
        env:
          TM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :android-app:assembleRelease -PappVersion="$VERSION" -PappVersionCode="$GITHUB_RUN_NUMBER"
          cp android-app/build/outputs/apk/release/android-app-release.apk "traffic-maniac-$VERSION.apk"
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "traffic-maniac-${GITHUB_REF_NAME#v}.apk" \
            --title "Traffic Maniac ${GITHUB_REF_NAME#v}" --generate-notes $PRERELEASE
