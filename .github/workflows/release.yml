name: Release

# Ein Tag wie v0.2.0 (mit Bindestrich, z. B. v0.2.0-preview.1, als Vorabversion) legt ein GitHub-Release an:
# - Windows-Installer (MSI), gebaut auf einem Windows-Runner – unsigniert, Windows warnt beim ersten Start
# - Android-APK, aber nur mit Release-Schlüssel in den Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; ohne sie lädt man die lokal signierte APK von Hand ins Release
#   (TM_KEYSTORE=… ./gradlew :android-app:assembleRelease, siehe README)
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # Die Karte ist nicht eingecheckt (wird erzeugt): einmal aus dem aktuellen OSM-Auszug importieren
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Karte importieren
        run: ./gradlew importCity -Pcity=pforzheim
      - uses: actions/upload-artifact@v7
        with:
          name: map
          path: cities/pforzheim/map.city
          if-no-files-found: error

  windows:
    needs: map
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: map
          path: cities/pforzheim
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Installer bauen
        shell: bash
        env:
          # Adresse des Statistik-Servers (Repository-Variable STATS_URL); leer = das Spiel sendet nichts
          STATS_URL: ${{ vars.STATS_URL }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATS=""
          if [ -n "$STATS_URL" ]; then STATS="-PstatsUrl=$STATS_URL"; fi
          ./gradlew :desktop-app:packageMsi :desktop-app:createDistributable -PappVersion="$VERSION" $STATS
          mkdir -p dist
          cp desktop-app/build/compose/binaries/main/msi/*.msi "dist/traffic-maniac-$VERSION-windows.msi"
      # Zum Entpacken statt Installieren (z. B. ohne MSI-Rechte oder wenn SmartScreen das MSI blockiert):
      # derselbe Programmordner wie im Installer, samt Java-Laufzeit und Karte
      - name: ZIP packen und testen
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $zip = "dist/traffic-maniac-$version-windows.zip"
          Compress-Archive -Path "desktop-app/build/compose/binaries/main/app/Traffic Maniac" -DestinationPath $zip
          Expand-Archive $zip -DestinationPath zip-test
          $run = Start-Process "zip-test/Traffic Maniac/Traffic Maniac.exe" -ArgumentList "--smoke-test" -Wait -PassThru -RedirectStandardOutput zip.out -RedirectStandardError zip.err
          Get-Content zip.out, zip.err -ErrorAction SilentlyContinue
          if ($run.ExitCode -ne 0) { throw "Smoke-Test aus dem ZIP fehlgeschlagen (Exit $($run.ExitCode))" }
      # Das MSI so prüfen, wie ein Spieler es bekommt: erst die letzte veröffentlichte Version installieren, dann das
      # neue MSI drüber (Update muss ohne Deinstallieren klappen), dann ohne Fenster starten.
      # Scheitert das Update, fehlt die Karte oder startet das Spiel nicht, wird nichts veröffentlicht.
      - name: Installer testen (Update + Smoke-Test)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = gh release list --limit 20 --json tagName --jq '.[].tagName' | Where-Object { $_ -ne "$env:GITHUB_REF_NAME" } | Select-Object -First 1
          if ($previous) {
            gh release download $previous --pattern "*.msi" --dir previous
            $old = Get-ChildItem previous/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($old) {
              Write-Host "Vorversion $previous installieren"
              $p = Start-Process msiexec.exe -ArgumentList "/i `"$($old.FullName)`" /qn /l*v msi-previous.log" -Wait -PassThru
              if ($p.ExitCode -ne 0) { Get-Content msi-previous.log -Tail 50; throw "Vorversion ließ sich nicht installieren ($($p.ExitCode))" }
            }
          }
          $msi = (Get-ChildItem dist/*.msi).FullName
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v msi-install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content msi-install.log -Tail 50; throw "MSI-Installation/Update fehlgeschlagen ($($install.ExitCode))" }
          # Nach dem Update darf genau ein Eintrag in „Apps & Features“ stehen
          $entries = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*, HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*raffic*aniac*" }
          $entries | ForEach-Object { Write-Host "Installiert: $($_.DisplayName) $($_.DisplayVersion)" }
          if (@($entries).Count -ne 1) { throw "Erwartet genau eine Installation, gefunden: $(@($entries).Count)" }
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA, $env:ProgramFiles -Recurse -Filter "Traffic Maniac.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Traffic Maniac.exe nach der Installation nicht gefunden" }
          Write-Host "Installiert: $($exe.FullName)"
          $run = Start-Process $exe.FullName -ArgumentList "--smoke-test" -Wait -PassThru -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          Get-Content smoke.out, smoke.err -ErrorAction SilentlyContinue
          if ($run.ExitCode -ne 0) { throw "Smoke-Test fehlgeschlagen (Exit $($run.ExitCode): 2 = keine Karte, 3 = Absturz, 4 = falsche Java-Laufzeit)" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/

  android:
    needs: map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: map
          path: cities/pforzheim
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: APK bauen (nur mit Release-Schlüssel)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Adresse des Statistik-Servers wie beim Windows-Installer; leer = die App sendet nichts
          STATS_URL: ${{ vars.STATS_URL }}
        run: |
          mkdir -p dist
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Kein Release-Schlüssel hinterlegt – die APK bitte lokal bauen und von Hand anhängen."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export TM_KEYSTORE="$RUNNER_TEMP/release.jks"
          VERSION="${GITHUB_REF_NAME#v}"
          STATS=""
          if [ -n "$STATS_URL" ]; then STATS="-PstatsUrl=$STATS_URL"; fi
          ./gradlew :android-app:assembleRelease -PrequireMap -PappVersion="$VERSION" -PappVersionCode="$GITHUB_RUN_NUMBER" $STATS
          cp android-app/build/outputs/apk/release/android-app-release.apk "dist/traffic-maniac-$VERSION.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/
          if-no-files-found: ignore

  release:
    needs: [ windows, android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Die Karte steckt in Installer und APK und liegt zusätzlich bei – das Spiel lädt sie von hier nach,
          # wenn sie fehlt (MapDownload: releases/download/<tag>/<stadt>.city)
          mv dist/map.city dist/pforzheim.city
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Traffic Maniac ${GITHUB_REF_NAME#v}" --generate-notes $PRERELEASE
